name: CI Gatekeeper

on:
  pull_request:
    branches: [ "main" , "fix/broken-code-test" ]
  push:
    branches: [ "main" ]  # Also run on direct pushes to main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx lint-staged

      - name: Run tests
        run: npm test
        
      - name: Build project
        run: npm run build