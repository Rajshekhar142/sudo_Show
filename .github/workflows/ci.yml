# This is the name of our workflow 
name: CI Gatekeeper

# This is the "trigger"
on:
  # Run this workflow on every pull request that targets the 'main' branch
  pull_request:
    branches: [ "main" ]

# This is the "what to do" part
jobs:
  # We'll call our job "build-and-test"
  build-and-test:
  # This is the virtual machine to use (a fresh ubuntu server)
  runs-on: ubuntu-latest

  # These are the steps to run, in order
  steps:
    # 1. Get the code from your repo
    - name: Check out repository code
      uses: actions/checkout@v4
    # 2. set up Node.js env
    - name: set up Node.js
      uses: actions/setup-node@v4
      with:
        # use the version of nodejs as in your project
        node-version: '24.4.1'
        # this speeds up future builds by caching your node modules
        cache: 'npm'
    # 3. install dependencies
    - name: Install dependencies
      run: npm ci 

      # 4. Run the linter
    - name: Run linter
      run: npm run lint

    # 5. Run the tests
    - name: Run tests
      run: npm run test
